# REV-02 — Phantom Protocol
#
# Verified against GZ::CTF 1.9.1 (commit 23ccbbaa), the same version used for
# WEB-01..WEB-05 and REV-01.
#
# GZ::CTF does not import challenge YAML: DynamicContainer challenges are created
# through the admin UI or /api/Edit/Games/... . This file is the authoritative
# value set for that configuration; every key under `gzctf` maps to a verified
# GZ::CTF 1.9.1 model property:
#   ChallengeCategory.Reverse        -> Utils/Enums.cs
#   ChallengeType.DynamicContainer   -> Utils/Enums.cs
#   ContainerConfig.Image/ExposedPort/MemoryLimit/CPUCount/StorageLimit/NetworkMode
#                                    -> Models/Internal/ContainerConfig.cs
#   Challenge.Hints (List<string>)   -> Models/Data/Challenge.cs
# This file contains no flag.

id: REV-02
name: Phantom Protocol
author: AxumSec
category: Reverse
type: DynamicContainer
difficulty: Hard
points: 300
flag_format: "AXUM{...}"
authentication: none

public:
  description: |
    A decommissioned licence client from the Aegis Communications Phantom
    Protocol pilot was recovered from a field intercept, together with the data
    file it consumes. The accepted access token is not recorded anywhere.

    You have the executable and its protocol data.

    Recover the accepted token and submit it.

  hints:
    - |
      **Hint 1 — Inspect the artifact**

      Inspect the executable's file format, metadata, and strings.
    - |
      **Hint 2 — Follow the validation**

      Locate the token-validation routine and follow how it processes candidate
      bytes.
    - |
      **Hint 3 — The stages are reversible**

      Look for repeated byte operations, position-dependent arithmetic, and bit
      rotations. The transformations are reversible.

gzctf:
  # ChallengeCategory.Reverse
  category: Reverse
  # ChallengeType.DynamicContainer
  type: DynamicContainer
  # ChallengeUpdateModel.Difficulty is the score coefficient (double), not the
  # display difficulty. 1.0 keeps the score flat.
  difficulty: 1.0
  isEnabled: true
  originalScore: 300
  minScoreRate: 1.0
  submissionLimit: 0

  # `[TEAM_HASH]` resolves to 12 hex characters derived from the team token
  # (verified placeholder syntax for GZ::CTF 1.9.1).
  flagTemplate: "AXUM{phantom_protocol_[TEAM_HASH]}"

  # Image must be pullable by the platform's container provider.
  containerImage: "registry.axumsec.example/ctf/rev-02-phantom-protocol:1.0.0"
  # Port the download service listens on; GZ::CTF maps it to a random host port.
  exposePort: 3000
  # ContainerConfig.MemoryLimit / CPUCount / StorageLimit
  memoryLimit: 128
  cpuCount: 1
  storageLimit: 64
  networkMode: Open
  enableTrafficCapture: false

  # Hints are plain markdown strings (Challenge.Hints is List<string>).
  hints:
    - |
      **Hint 1 — Inspect the artifact**

      Inspect the executable's file format, metadata, and strings.
    - |
      **Hint 2 — Follow the validation**

      Locate the token-validation routine and follow how it processes candidate
      bytes.
    - |
      **Hint 3 — The stages are reversible**

      Look for repeated byte operations, position-dependent arithmetic, and bit
      rotations. The transformations are reversible.
